<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三叶 Trefoil Group · 云南大学</title>
<meta name="description" content="三叶 Trefoil Group，依托云南大学软件学院人工智能学院、云南省软件工程重点实验室。">
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="index.css">
</head>
<body>

<!-- 报头：白底、品牌在左、链接居中偏右、语言按钮描边（CRR .header-section） -->
<header class="mast" id="mast">
  <div class="wrap mast__in">
    <a class="brand" href="#top">
      <svg class="brand__mark" aria-hidden="true"><use href="#knot"></use></svg>
      <span class="brand__txt"><strong data-i18n="brand.name"></strong><em data-i18n="brand.sub"></em></span>
    </a>
    <button type="button" class="navbtn" id="nav-toggle" aria-expanded="false" aria-controls="nav">
      <span class="navbtn__b" aria-hidden="true"></span><span data-i18n="nav.menu"></span>
    </button>
    <nav class="nav" id="nav">
      <a href="#top" data-i18n="nav.home"></a>
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#areas" data-i18n="nav.areas"></a>
      <a href="#team" data-i18n="nav.team"></a>
      <a href="#partners" data-i18n="nav.partners"></a>
      <a href="#openings" data-i18n="nav.openings"></a>
      <a href="#contact" data-i18n="nav.join"></a>
    </nav>
    <button type="button" id="lang-toggle" class="lang" data-i18n-title="nav.langLabel"><span data-i18n="nav.lang"></span></button>
  </div>
</header>

<main id="main">

  <!-- 首屏：满幅底图 + 左对齐特大粗体（CRR .home-section） -->
  <section class="home" id="top">
    <img class="home__bg" src="./imgs/banner4.jpg" width="1456" height="816" alt="" fetchpriority="high" decoding="async">
    <span class="home__veil" aria-hidden="true"></span>
    <div class="wrap home__in">
      <div class="home__txt">
        <p class="home__eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 class="home__h">
          <span class="home__zh" data-i18n="brand.name"></span>
          <span class="home__en" data-i18n="brand.sub"></span>
        </h1>
        <p class="home__tag" data-i18n="hero.tagline"></p>
        <p class="home__act">
          <a class="btn" href="#areas" data-i18n="nav.areas"></a>
          <a class="btn btn--o" id="ident-mail" href="#contact" data-i18n="join.write"></a>
        </p>
      </div>
      <div class="home__art" aria-hidden="true">
        <svg class="knotart" viewBox="0 0 100 100"><use href="#knot"></use></svg>
      </div>
    </div>
  </section>

  <!-- 01 关于：白底，居中大标题 -->
  <section class="sec" id="about" aria-labelledby="about-h">
    <div class="wrap">
      <header class="stitle">
        <h2 id="about-h" data-i18n="about.title"></h2>
      </header>
      <div class="about"><p data-i18n="about.p1"></p></div>
    </div>
  </section>

  <!-- 02 研究方向：浅灰带 + 悬停反黑的卡片（CRR .three-grids-columns） -->
  <section class="sec sec--grey" id="areas" aria-labelledby="areas-h">
    <div class="wrap">
      <header class="stitle">
        <h2 id="areas-h" data-i18n="areas.title"></h2>
      </header>
      <ol class="areas" id="areas-list"></ol>
    </div>
  </section>

  <!-- 03 成员：深底 + 白卡片、7rem 圆形头像居中（CRR .team-section） -->
  <section class="sec sec--dark" id="team" aria-labelledby="team-h">
    <div class="wrap">
      <header class="stitle stitle--on-dark">
        <h2 id="team-h" data-i18n="team.title"></h2>
      </header>
      <ol class="team" id="team-list"></ol>
    </div>
  </section>

  <!-- 04 合作伙伴：白底，小卡片 -->
  <section class="sec" id="partners" aria-labelledby="partners-h">
    <div class="wrap">
      <header class="stitle">
        <h2 id="partners-h" data-i18n="partners.title"></h2>
      </header>
      <ul class="pcards" id="partners-list"></ul>
    </div>
  </section>

  <!-- 05 加入与合作：上下两块面板；每块内部三格一排。
       招募那块的第三格就是「来信请附个人简历 + 来信按钮」。 -->
  <section class="sec sec--grey" id="openings" aria-labelledby="openings-h">
    <div class="wrap">
      <header class="stitle">
        <h2 id="openings-h" data-i18n="nav.openings"></h2>
      </header>
      <div class="panels panels--stack">
        <section class="panel">
          <header class="panel__h">
            <h3 data-i18n="openings.students"></h3>
            <p class="panel__hn" data-i18n="openings.studentsNote"></p>
          </header>
          <div class="panel__body">
            <ol class="panel__list" role="list" id="openings-list"></ol>
          </div>
        </section>
        <section class="panel">
          <header class="panel__h">
            <h3 data-i18n="openings.collab"></h3>
            <p class="panel__hn" data-i18n="openings.collabNote"></p>
          </header>
          <div class="panel__body">
            <ol class="panel__list" role="list" id="collabs-list"></ol>
          </div>
        </section>
      </div>
    </div>
  </section>



</main>

<!-- 页脚：#111，上栏左品牌右链接列，下栏居中版权（CRR .footerbox） -->
<!-- 页脚兼联系：#contact 落在这里，导航的「联系」仍然指得到 -->
<footer class="foot" id="contact">
  <div class="wrap">
    <div class="foot__top">
      <div class="foot__brand">
        <svg class="foot__mark" aria-hidden="true"><use href="#knot"></use></svg>
        <p class="foot__name"><strong data-i18n="brand.name"></strong> <em data-i18n="brand.sub"></em></p>
        <p class="foot__affil" data-i18n="footer.affil"></p>
      </div>

      <div class="foot__col foot__col--nav">
        <h2 class="foot__ch" data-i18n="footer.links"></h2>
        <ul>
          <li><a href="#about" data-i18n="nav.about"></a></li>
          <li><a href="#areas" data-i18n="nav.areas"></a></li>
          <li><a href="#team" data-i18n="nav.team"></a></li>
          <li><a href="#partners" data-i18n="nav.partners"></a></li>
          <li><a href="#openings" data-i18n="nav.openings"></a></li>
        </ul>
      </div>

      <div class="foot__col foot__col--info">
        <h2 class="foot__ch" id="foot-contact-h"></h2>
        <dl class="cinfo" id="cinfo"></dl>
      </div>

      <div class="foot__col foot__col--qr" id="foot-qr"></div>
    </div>
    <div class="foot__bottom">
      <p><span id="foot-year"></span> <span data-i18n="footer.rights"></span> <span class="foot__icp" data-i18n="footer.icp"></span></p>
      <p><a href="#top" data-i18n="footer.top"></a></p>
    </div>
  </div>
</footer>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
